<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行AA记账</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>旅行AA记账</h1>
            <!-- 旅行台账管理 -->
            <div class="trip-management">
                <div class="trip-selector">
                    <select id="trip-select" class="trip-select">
                        <option value="">选择旅行台账</option>
                    </select>
                    <button id="new-trip-btn" class="btn-secondary">新建台账</button>
                    <button id="delete-trip-btn" class="btn-danger">删除台账</button>
                </div>
                <!-- 新建台账表单 -->
                <div id="new-trip-form" class="hidden">
                    <input type="text" id="trip-name-input" placeholder="请输入旅行名称">
                    <button id="confirm-trip-btn" class="btn-secondary">确认</button>
                    <button id="cancel-trip-btn" class="btn-danger">取消</button>
                </div>
            </div>
            
            <!-- 参与者管理 -->
            <div class="participants-management">
                <h3>参与者管理</h3>
                <div class="participants-controls">
                    <input type="text" id="participant-name-input" placeholder="请输入参与者姓名">
                    <button id="add-participant-btn" class="btn-secondary">添加参与者</button>
                </div>
                <div id="participants-list" class="participants-list"></div>
            </div>
            <nav>
                <ul>
                    <li><button class="nav-btn active" data-target="form">添加支出</button></li>
                    <li><button class="nav-btn" data-target="records">支出记录</button></li>
                    <li><button class="nav-btn" data-target="dashboard">支出分析</button></li>
                    <li><button class="nav-btn" data-target="settlement">一键清算</button></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <!-- 添加支出表单 -->
            <section id="form" class="section active">
                <h2>添加支出记录</h2>
                <form id="expense-form">
                    <div class="form-group">
                        <label for="date">日期</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="time">时间</label>
                        <input type="time" id="time" required>
                    </div>
                    <div class="form-group">
                        <label for="location">地点</label>
                        <input type="text" id="location" placeholder="例如：北京烤鸭店" required>
                    </div>
                    <div class="form-group">
                        <label for="description">支出事项</label>
                        <input type="text" id="description" placeholder="例如：晚餐" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">金额 (¥)</label>
                        <input type="number" id="amount" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="payer">支出人</label>
                        <select id="payer" required>
                            <option value="">请选择支出人</option>
                            <!-- 参与者选项将通过JavaScript动态添加 -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="participants">参与人</label>
                        <div class="participants-checkboxes" id="participants-checkboxes">
                            <!-- 参与者复选框将通过JavaScript动态添加 -->
                        </div>
                        <input type="hidden" id="participants" required>
                    </div>
                    <div class="form-group">
                        <label for="category">分类</label>
                        <select id="category" required>
                            <option value="">请选择分类</option>
                            <option value="餐饮">餐饮</option>
                            <option value="交通">交通</option>
                            <option value="住宿">住宿</option>
                            <option value="门票">门票</option>
                            <option value="购物">购物</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes">备注</label>
                        <textarea id="notes" placeholder="可选备注信息"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">保存记录</button>
                </form>
            </section>
            
            <!-- 支出记录 -->
            <section id="records" class="section">
                <h2>支出记录</h2>
                <div class="records-container">
                    <div class="filter-bar">
                        <input type="text" id="search" placeholder="搜索记录...">
                        <select id="category-filter">
                            <option value="">全部分类</option>
                            <option value="餐饮">餐饮</option>
                            <option value="交通">交通</option>
                            <option value="住宿">住宿</option>
                            <option value="门票">门票</option>
                            <option value="购物">购物</option>
                            <option value="其他">其他</option>
                        </select>
                        <button id="clear-filter">清除筛选</button>
                    </div>
                    <div id="records-list"></div>
                </div>
            </section>
            
            <!-- 支出分析 -->
            <section id="dashboard" class="section">
                <h2>支出分析</h2>
                <div class="dashboard-container">
                    <div class="summary-cards">
                        <div class="card">
                            <h3>总支出</h3>
                            <p id="total-amount">¥0.00</p>
                        </div>
                        <div class="card">
                            <h3>支出笔数</h3>
                            <p id="total-count">0</p>
                        </div>
                        <div class="card">
                            <h3>平均每笔</h3>
                            <p id="avg-amount">¥0.00</p>
                        </div>
                    </div>
                    <div class="charts">
                        <div class="chart-container">
                            <h3>支出分类</h3>
                            <div id="category-chart"></div>
                        </div>
                        <div class="chart-container">
                            <h3>支出人分布</h3>
                            <div id="payer-chart"></div>
                        </div>
                    </div>
                    <div class="details">
                        <h3>详细统计</h3>
                        <div id="details-table"></div>
                    </div>
                </div>
            </section>
            
            <!-- 一键清算 -->
            <section id="settlement" class="section">
                <h2>一键清算</h2>
                <div class="settlement-container">
                    <button id="calculate-settlement" class="settlement-btn">生成转账方案</button>
                    <div id="settlement-result"></div>
                </div>
            </section>
        </main>
        
        <footer>
            <p>© 2026 旅行AA记账</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
